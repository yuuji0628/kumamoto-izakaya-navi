<section class="section"><div class="container"><form class="form-card" id="listingForm">
<div class="form-grid">
<div class="field"><label>店舗名 *</label><input name="shop_name" required></div>
<div class="field"><label>ご担当者名 *</label><input name="contact_name" required></div>
<div class="field"><label>メールアドレス *</label><input name="email" type="email" required></div>
<div class="field"><label>電話番号</label><input name="phone"></div>
<div class="field"><label>エリア</label><select name="area"><option value="">選択してください</option><option value="熊本市">熊本市</option><option value="八代市">八代市</option><option value="人吉市">人吉市</option><option value="荒尾市">荒尾市</option><option value="水俣市">水俣市</option><option value="玉名市">玉名市</option><option value="山鹿市">山鹿市</option><option value="菊池市">菊池市</option><option value="宇土市">宇土市</option><option value="上天草市">上天草市</option><option value="宇城市">宇城市</option><option value="阿蘇市">阿蘇市</option><option value="天草市">天草市</option><option value="合志市">合志市</option><option value="美里町">美里町</option><option value="玉東町">玉東町</option><option value="南関町">南関町</option><option value="長洲町">長洲町</option><option value="和水町">和水町</option><option value="大津町">大津町</option><option value="菊陽町">菊陽町</option><option value="南小国町">南小国町</option><option value="小国町">小国町</option><option value="産山村">産山村</option><option value="高森町">高森町</option><option value="西原村">西原村</option><option value="南阿蘇村">南阿蘇村</option><option value="御船町">御船町</option><option value="嘉島町">嘉島町</option><option value="益城町">益城町</option><option value="甲佐町">甲佐町</option><option value="山都町">山都町</option><option value="氷川町">氷川町</option><option value="芦北町">芦北町</option><option value="津奈木町">津奈木町</option><option value="錦町">錦町</option><option value="多良木町">多良木町</option><option value="湯前町">湯前町</option><option value="水上村">水上村</option><option value="相良村">相良村</option><option value="五木村">五木村</option><option value="山江村">山江村</option><option value="球磨村">球磨村</option><option value="あさぎり町">あさぎり町</option><option value="苓北町">苓北町</option></select></div>
<div class="field"><label>ジャンル</label><select name="genre"><option value="">選択してください</option><option value="焼き鳥">焼き鳥</option><option value="海鮮">海鮮</option><option value="馬刺し">馬刺し</option><option value="郷土料理">郷土料理</option><option value="大衆居酒屋">大衆居酒屋</option><option value="創作料理">創作料理</option><option value="鉄板焼き">鉄板焼き</option><option value="串揚げ">串揚げ</option><option value="餃子">餃子</option><option value="焼肉">焼肉</option><option value="炉端焼き">炉端焼き</option><option value="和食">和食</option></select></div>
<div class="field full"><label>住所</label><input name="address"></div>
<div class="field"><label>営業時間</label><input name="hours" placeholder="例 17:00〜24:00"></div>
<div class="field"><label>定休日</label><input name="holiday" placeholder="例 月曜日"></div>
<div class="field"><label>料金目安</label><input name="budget" placeholder="例 3,000〜5,000円"></div>
<div class="field"><label>Instagram</label><input name="instagram" placeholder="@username"></div>
<div class="field full"><label>お店の特徴</label><input name="features" placeholder="個室、飲み放題、宴会、馬刺し など"></div>
<div class="field full"><label>店舗紹介</label><textarea name="description" placeholder="お店の雰囲気やおすすめ料理など"></textarea></div>
<div class="field"><label>求人掲載</label><select name="wants_job"><option value="0">なし</option><option value="1">あり</option></select></div>
<div class="field"><label>掲載可能な写真</label><input name="photo" type="file" accept="image/*"></div>
<div class="field full"><button class="gold-btn" type="submit" style="border:0;width:100%">掲載申込みを送信</button></div>
</div>
