<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>管理画面ログイン | KUMAMOTO BAR NAVI</title>
<style>
:root{--bg:#060b12;--card:#0d151f;--line:#2c3946;--gold:#e4b94f;--text:#f5f7f8;--muted:#94a0ac}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(228,185,79,.1),transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;display:grid;place-items:center;padding:22px}
.card{width:min(100%,460px);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 25px 70px rgba(0,0,0,.35)}
.brand{text-align:center;margin-bottom:24px}.brand img{width:84px;height:84px;object-fit:cover;border-radius:20px;margin:auto}.brand h1{font-family:"Yu Mincho",serif;font-size:24px;margin:12px 0 3px}.brand p{color:var(--gold);font-size:9px;letter-spacing:.2em;margin:0}
label{display:block;color:#b9c2ca;font-size:12px;font-weight:800;margin:12px 0 6px}
input{width:100%;height:50px;border:1px solid #344250;border-radius:12px;background:#08111a;color:#fff;padding:0 13px;font-size:16px;outline:none}
button{width:100%;height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#efc45a,#c9982f);font-weight:900;color:#17120b;margin-top:18px;font-size:15px}
.msg{min-height:20px;margin-top:12px;font-size:12px;color:#e8c96f}.sub{color:var(--muted);font-size:11px;line-height:1.7;margin-top:14px}.back{display:block;text-align:center;margin-top:17px;color:#8e99a4;font-size:12px}
</style></head><body>
<div class="card">
<div class="brand"><img src="logo-emblem.jpg" alt=""><h1>KUMAMOTO BAR NAVI 管理画面</h1><p>KUMAMOTO BAR NAVI</p></div>
<form id="form">
<label>メールアドレス</label><input id="email" type="email" autocomplete="username" required>
<label>パスワード</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">ログイン</button>
</form>
<div id="msg" class="msg"></div><div class="sub">管理者のみアクセスできます。</div>
<div class="sub" style="text-align:center;opacity:.55">ver1.14</div><a class="back" href="/">← サイトへ戻る</a>
</div>
<script>
const $=id=>document.getElementById(id),form=$("form"),submit=$("submit");
const msg=t=>$("msg").textContent=t||"";
async function parseResponse(r){const raw=await r.text();try{return JSON.parse(raw)}catch{return {ok:false,error:"HTTP_"+r.status,detail:raw.slice(0,160)}}}
async function status(){
 try{
  const savedToken=localStorage.getItem("kbn_admin_token")||"";
  const headers={"cache-control":"no-cache"};
  if(savedToken)headers.authorization="Bearer "+savedToken;
  const r=await fetch("/api/admin/status?t="+Date.now(),{cache:"no-store",credentials:"include",headers});
  const d=await parseResponse(r);
  if(d.authenticated){location.replace("/admin.html?v=114");return}
  if(savedToken)localStorage.removeItem("kbn_admin_token");
 }catch(e){msg("接続を確認できません。少し待って再読み込みしてください。")}
}
form.addEventListener("submit",async e=>{
 e.preventDefault();msg("");submit.disabled=true;
 const email=$("email").value.trim(),password=$("password").value;
 try{
  const r=await fetch("/api/admin/login?t="+Date.now(),{method:"POST",headers:{"content-type":"application/json","cache-control":"no-cache"},credentials:"include",cache:"no-store",body:JSON.stringify({email,password})});
  const d=await parseResponse(r);
  if(!r.ok||!d.ok){
   if(d.error==="ADMIN_AUTH_NOT_CONFIGURED"){msg("管理者設定が未完了です。Cloudflareの管理者設定を確認してください。");return}
   msg("メールアドレスまたはパスワードが違います。"+(d.error?"（"+d.error+"）":""));return
  }
  if(!d.token){msg("ログイン応答にトークンがありません。");return}
  localStorage.setItem("kbn_admin_token",d.token);
  localStorage.setItem("kbn_admin_logged_in_at",String(Date.now()));
  location.replace("/admin.html?v=114")
 }catch(e){msg("通信に失敗しました。再読み込みしてもう一度お試しください。")}
 finally{submit.disabled=false}
});
status();
</script></body></html>
